<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#181a2f"><title>QUEST DAY — 전투 영웅단 36종 일러스트</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#141628;color:#f7f4ff}
main{max-width:1120px;margin:auto;padding:22px 15px 72px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(21px,3vw,30px);margin:0 0 6px}p{margin:5px 0;color:#b6b4cf;font-size:13px;line-height:1.5}a{color:#d3c7ff}
#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hero{padding:13px;background:#22233a;border:1px solid #37395d;border-radius:17px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 1px 9px}
h2{font-size:16px;margin:0}.pill{font-size:10px;color:#f6dea3;border:1px solid #766c58;padding:5px 9px;border-radius:40px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.stage{border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 43%,#56567e,#282944 76%);border:1px solid #484764;padding:6px 2px 4px;text-align:center;cursor:zoom-in}
.stage svg{width:100%;height:auto;max-height:215px;display:block}
.stage span{display:block;font-size:12px;color:#d8d3ef;font-weight:650}
.stage a{display:inline-block;margin:4px 0 2px;color:#dbcaff;font-size:11px;text-decoration:underline;text-underline-offset:3px}
.note{color:#a9a9bf;font-size:11px;margin-top:7px;min-height:30px}
#zoom{display:none;position:fixed;inset:0;z-index:90;align-items:center;justify-content:center;background:#10111bec;padding:22px}
#zoom.open{display:flex}#zoom .picture{height:min(87vh,760px);max-width:90vw;aspect-ratio:5/5.6;background:radial-gradient(circle,#585274,#24253c);border-radius:18px}
#zoom svg{width:100%;height:100%}#exit{position:fixed;right:18px;top:15px;background:#faf5ff;color:#332a49;padding:8px 13px;border:0;border-radius:9px}
.error{padding:30px;color:#ffbbbb}

.demo-actions{display:flex;gap:7px;margin-top:10px}
.demo-actions button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;border:1px solid #6e69a5;background:#342e56;color:#f9f4ff;font-size:12px;font-weight:750;cursor:pointer}
.demo-actions button:hover{background:#4c417d}
#zoom .picture{position:relative;isolation:isolate;overflow:hidden}
#zoom .picture.demo-evolving{--demo-aura:#b4a2ff}
#zoom .picture.demo-evolving::before{content:'';position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle,var(--demo-aura),transparent 72%);opacity:0;z-index:2;pointer-events:none;animation:qdprev-flare 2.5s both}
.demo-form{position:absolute;inset:0;display:grid;place-items:center}
.demo-form.before{animation:qdprev-before 2.4s both}
.demo-form.after{opacity:0;animation:qdprev-after 2.4s both}
@keyframes qdprev-before{0%,20%{opacity:1;transform:scale(1)}45%{opacity:.85;transform:scale(.95);filter:brightness(2)}70%,100%{opacity:0;transform:scale(.8)}}
@keyframes qdprev-after{0%,41%{opacity:0;transform:translateY(12px) scale(.82)}60%{opacity:1;transform:translateY(-8px) scale(1.06);filter:brightness(1.6)}100%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}
@keyframes qdprev-flare{0%,28%{opacity:0;transform:scale(.3)}50%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.demo-form,.demo-form.before,.demo-form.after,#zoom .picture.demo-evolving::before{animation:none!important}.demo-form.before{display:none}.demo-form.after{opacity:1!important}#zoom .picture.demo-evolving::before{display:none}}

@media(max-width:650px){#gallery{grid-template-columns:1fr}.hero{padding:10px}.stages{gap:5px}.stage svg{max-height:175px}}
</style></head><body>
<main><header><div><h1>⚔️ QUEST DAY — 신규 전투 영웅단</h1>
<p>기존 캐릭터 12명 유지 + 신규 캐릭터 12명 추가 · 캐릭터당 3단계</p>
<p>본 페이지는 게임에 실제 적용된 원화풍 캐릭터 일러스트입니다. 진화 단계별 모습을 눌러 확대할 수 있습니다.</p></div><a href="./index.html">게임으로 돌아가기</a></header>
<div id="gallery"><p>캐릭터를 불러오는 중...</p></div></main>
<div id="zoom" role="dialog" aria-modal="true" aria-label="영웅 일러스트 확대 보기"><button id="exit">닫기 ×</button><div class="picture"></div></div>
<script src="./hero-portraits.js?v=20261115-11"></script>
<script>
(async()=>{
const box=document.getElementById('gallery'),overlay=document.getElementById('zoom'),picture=overlay.querySelector('.picture');
try{
 const r=await fetch('./characters-1.3.json',{cache:'no-cache'});
 if(!r.ok)throw new Error('도감 HTTP '+r.status);
 const characters=(await r.json()).characters.filter(c=>c.collection==='vanguard');
 if(!window.QuestDayHeroArt)throw new Error('일러스트 모듈을 찾을 수 없습니다');
 box.textContent='';
 characters.forEach(c=>{
  const section=document.createElement('section');section.className='hero';
  const top=document.createElement('div');top.className='top';
  const title=document.createElement('h2');title.textContent=c.name+' · '+c.role;
  const rarity=document.createElement('span');rarity.className='pill';rarity.textContent=c.rarity.toUpperCase();
  top.append(title,rarity);section.append(top);
  const stages=document.createElement('div');stages.className='stages';
  for(let stage=1;stage<=3;stage++){
    const panel=document.createElement('div');panel.className='stage';panel.innerHTML=window.QuestDayHeroArt.draw(c.id,stage);
    const label=document.createElement('span');label.textContent='진화 '+stage+'/3';panel.append(label);
    const stageLink=document.createElement('a');
    stageLink.href='./art/painted/individual/'+c.id+'-stage'+stage+'.webp?v=20261115-11';
    stageLink.textContent='개별 원화 보기';
    stageLink.target='_blank';
    stageLink.rel='noopener';
    stageLink.onclick=(event)=>event.stopPropagation();
    panel.append(stageLink);
    panel.onclick=()=>{picture.className='picture';picture.innerHTML=window.QuestDayHeroArt.draw(c.id,stage);overlay.classList.add('open')};
    stages.append(panel);
  }
  section.append(stages);
  const note=document.createElement('p');note.className='note';note.textContent=c.tagline;section.append(note);
  const actions=document.createElement('div');actions.className='demo-actions';
  for(const to of [2,3]){
    const button=document.createElement('button');button.type='button';button.textContent='진화 '+(to-1)+' → '+to+' 체험';
    button.onclick=()=>{
      const before=window.QuestDayHeroArt.draw(c.id,to-1);
      const after=window.QuestDayHeroArt.draw(c.id,to);
      picture.style.setProperty('--demo-aura',c.visual?.palette?.[0]||'#b4a2ff');
      picture.className='picture';
      picture.innerHTML='<div class="demo-form before">'+before+'</div><div class="demo-form after">'+after+'</div>';
      // Restart the single-run animation when the same test is opened twice.
      void picture.offsetWidth;
      picture.classList.add('demo-evolving');
      overlay.classList.add('open');
      document.getElementById('exit').focus();
    };
    actions.append(button);
  }
  section.append(actions);box.append(section);
 });
}catch(e){box.innerHTML='<p class="error">캐릭터 표시 오류: '+String(e.message||e)+'</p>';}
})();
document.getElementById('exit').onclick=()=>document.getElementById('zoom').classList.remove('open');
document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.target.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('zoom').classList.remove('open')});
</script></body></html>
