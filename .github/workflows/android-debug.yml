name: QUEST DAY - Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - scripts/build-mobile-web.mjs
      - index.html
      - account-deletion.js
      - account-deletion.html
      - privacy.html
      - upgrade-2.0-auth.js
      - upgrade-1.9-cloud.js
      - upgrade-1.6-realtime.js
      - sw.js
      - .github/workflows/android-debug.yml
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QUEST DAY
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK directory
        run: |
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Bundle the existing website
        run: npm run build:web
      - name: Verify bundled account and privacy features
        run: |
          test -f www/account-deletion.js
          test -f www/account-deletion.html
          test -f www/privacy.html
          test -f www/upgrade-2.0-auth.js
          test -f www/realtime-config.js
          grep -q 'quest-day-delete-account' www/account-deletion.js
          grep -q 'privacy.html' www/index.html
          node --check www/account-deletion.js
          node --check www/upgrade-2.0-auth.js
      - name: Create native Android project
        run: npx cap add android
      - name: Sync the website into Android
        run: npx cap sync android
      - name: Build debug APK for internal device testing
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-day-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
