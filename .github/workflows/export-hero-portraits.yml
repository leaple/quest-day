name: Export independent hero portraits
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export_individual_hero_portraits.py'
      - 'art/painted/heroes-*.webp'
      - '.github/workflows/export-hero-portraits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-36-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Export all 36 independent stage images
        run: python scripts/export_individual_hero_portraits.py
      - name: Commit images without changing user data or source artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/painted/individual
          if ! git diff --cached --quiet; then
            git commit -m "build(art): publish 36 distinct per-stage painted hero portraits"
            git push
          fi
