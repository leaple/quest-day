name: QUEST DAY - Android release AAB (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression checks
        run: |
          node scripts/test-native-navigation.mjs
          node scripts/test-notifications.mjs
      - name: Build web and Android
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android
      - name: Compile unsigned release bundle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Verify release bundle exists
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned bundle (NOT Play-ready)
        uses: actions/upload-artifact@v4
        with:
          name: quest-day-unsigned-release-aab-NOT-FOR-UPLOAD
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
