name: QUEST DAY - iOS simulator build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - scripts/build-mobile-web.mjs
      - index.html
      - account-deletion.js
      - account-deletion.html
      - privacy.html
      - upgrade-2.0-auth.js
      - upgrade-1.9-cloud.js
      - upgrade-1.6-realtime.js
      - sw.js
      - upgrade-2.2-native.js
      - scripts/test-native-navigation.mjs
      - .github/workflows/ios-simulator.yml
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout QUEST DAY
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Bundle existing website
        run: npm run build:web
      - name: Verify bundled account and privacy features
        run: |
          test -f www/account-deletion.js
          test -f www/account-deletion.html
          test -f www/privacy.html
          test -f www/upgrade-2.0-auth.js
          test -f www/realtime-config.js
          grep -q 'quest-day-delete-account' www/account-deletion.js
          grep -q 'privacy.html' www/index.html
          node --check www/account-deletion.js
          node --check www/upgrade-2.0-auth.js
          test -f www/upgrade-2.2-native.js
          node --check www/upgrade-2.2-native.js
          npm ls --depth=0 @capacitor/app @capacitor/keyboard
          node scripts/test-native-navigation.mjs
      - name: Create iOS native project
        run: npx cap add ios
      - name: Sync web files into iOS
        run: npx cap sync ios
      - name: Compile iOS Simulator app without signing
        run: |
          set -euo pipefail
          if [ -e ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          fi
