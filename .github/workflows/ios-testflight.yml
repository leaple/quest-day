name: QUEST DAY - TestFlight upload
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: io.github.leaple.questday
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required signing secrets
        env:
          CERTIFICATE_CER_BASE64: ${{ secrets.IOS_DISTRIBUTION_CER_BASE64 }}
          ENCRYPTED_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ENCRYPTED_PRIVATE_KEY_BASE64 }}
          CSR_KEY_PASSPHRASE: ${{ secrets.CSR_KEY_PASSPHRASE }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID APP_STORE_KEY_ID APP_STORE_ISSUER_ID CERTIFICATE_CER_BASE64 ENCRYPTED_PRIVATE_KEY_BASE64 CSR_KEY_PASSPHRASE PROFILE_BASE64 API_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing required secret: $name"; exit 1; fi
          done
        shell: bash
      - name: Build Capacitor iOS project
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add ios
          npx cap sync ios
      - name: Import distribution certificate and provisioning profile
        env:
          CERTIFICATE_CER_BASE64: ${{ secrets.IOS_DISTRIBUTION_CER_BASE64 }}
          ENCRYPTED_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ENCRYPTED_PRIVATE_KEY_BASE64 }}
          CSR_KEY_PASSPHRASE: ${{ secrets.CSR_KEY_PASSPHRASE }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf %s "$CERTIFICATE_CER_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.cer"
          printf %s "$ENCRYPTED_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private-key.encrypted.pem"
          openssl pkcs8 -in "$RUNNER_TEMP/private-key.encrypted.pem" -passin env:CSR_KEY_PASSPHRASE -out "$RUNNER_TEMP/private-key.pem"
          openssl x509 -inform DER -in "$RUNNER_TEMP/distribution.cer" -out "$RUNNER_TEMP/distribution.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/private-key.pem" -in "$RUNNER_TEMP/distribution.pem" -out "$RUNNER_TEMP/distribution.p12" -passout env:CSR_KEY_PASSPHRASE
          rm -f "$RUNNER_TEMP/private-key.pem"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CSR_KEY_PASSPHRASE" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/questday.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_name"
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          PROFILE_NAME="$(cat "$RUNNER_TEMP/profile_name")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT_ARGS=(-workspace ios/App/App.xcworkspace)
          else
            PROJECT_ARGS=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${PROJECT_ARGS[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QUESTDAY.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QUESTDAY.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload IPA to App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"
